# Serves the site as the ui-landing package builds it into dist/browser: the prerendered landing page
# at /, and the application at /app/, running in the visitor's browser on WebAssembly. Nothing here
# receives a file or keeps anything: the app reads files inside the tab, and this server only ever
# answers GET and HEAD for static files.
#
# Dropped into the http block (conf.d/ in the official images), so the maps below are at http
# level. Every header is set once, at server level, and varies by path through a map: a location
# that set its own add_header would silently drop all the others.

map $uri $site_cache_control {
    default                                             "no-cache";
    "~^/(app/)?[a-z]+-[A-Za-z0-9_-]{8}\.(js|css)$"     "public, max-age=31536000, immutable";
    "~^/(app/)?(fonts|screenshots)/"                    "public, max-age=604800";
    "~^/app-icon\.svg$"                                "public, max-age=604800";
}

# Neither page runs an inline script, so script-src is 'self'. Inline styles stay allowed: the
# prerendered landing carries its component styles in <style> tags, and the app installs its color
# tokens as one. The app adds what running on WebAssembly takes: compiling the module, and the web
# worker it runs in. Nothing may frame either page, and neither page frames anything.
map $uri $site_content_security_policy {
    default     "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'";
    "~^/app/"   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'none'";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    client_max_body_size 1k;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    add_header Cache-Control $site_cache_control always;
    add_header Content-Security-Policy $site_content_security_policy always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        limit_except GET HEAD {
            deny all;
        }

        try_files $uri $uri/ =404;
    }

    error_page 404 /index.html;
}
