<app-anchored-menu [placement]="placement()" [width]="menuWidth" (closeRequested)="closeRequested.emit()">
  <div class="export-menu-scope">
    <app-color-swatch [color]="color()" />
    <span class="export-menu-scope-label">{{ scopeLabel() }}</span>
  </div>
  @for (item of items(); track item.format) {
    <app-menu-option [tag]="item.tag" [heading]="item.title" [detail]="item.detail" (chosen)="formatChosen.emit(item.format)" />
  }
  @if (offersAllCharts()) {
    <div class="export-menu-divider"></div>
    <button class="export-menu-all" type="button" (click)="allChartsRequested.emit()">
      <span class="export-menu-all-icon">{{ texts().export.allChartsIcon }}</span>
      <span class="export-menu-all-label">{{ allChartsLabel() }}</span>
    </button>
  }
</app-anchored-menu>
