<div class="log-field-row">
  <div class="log-field-row-heading">
    <span class="log-field-row-label">{{ label() }}</span>
    <span class="log-field-row-hint">{{ hint() }}</span>
    <span class="spacer"></span>
    @if (isDetected()) {
      <span class="log-field-row-detected">{{ texts().logs.setup.detected }}</span>
    }
  </div>
  <button
    class="log-field-row-trigger"
    [class.log-field-row-trigger-open]="isOpen()"
    [class.log-field-row-trigger-blocked]="isBlocked() && hasPath()"
    type="button"
    [attr.aria-label]="label()"
    [attr.aria-expanded]="isOpen()"
    (click)="toggled.emit()"
  >
    <span class="log-field-row-path" [class.log-field-row-path-empty]="!hasPath()">{{ hasPath() ? path() : texts().logs.setup.chooseField }}</span>
    <span class="log-field-row-caret">{{ glyphs.CARET }}</span>
  </button>
  @if (isOpen()) {
    <div class="log-field-row-options" role="listbox" [attr.aria-label]="label()">
      @for (option of options(); track option.path) {
        <button
          class="log-field-row-option"
          [class.log-field-row-option-chosen]="option.path === path()"
          type="button"
          role="option"
          [attr.aria-selected]="option.path === path()"
          (click)="chosen.emit(option.path)"
        >
          <span class="log-field-row-option-path">{{ option.path }}</span>
          <span class="log-field-row-option-sample">{{ option.sample }}</span>
          <span class="log-field-row-option-check">{{ option.path === path() ? glyphs.CHECK : '' }}</span>
        </button>
      }
    </div>
  }
  <div class="log-field-row-note" [class.log-field-row-note-blocked]="isBlocked()" [class.log-field-row-note-warned]="isWarned()">
    <span class="log-field-row-note-glyph">{{ noteGlyph() }}</span>
    <span class="log-field-row-note-text">{{ validation().note }}</span>
  </div>
</div>
