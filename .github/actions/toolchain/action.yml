# The toolchain every job needs, in one place so five jobs cannot drift apart on which Go or
# which pnpm they run. Versions come from the repository rather than being written here again:
# go.mod names the Go version, and package.json's packageManager field names pnpm.
name: Toolchain
description: Install Go, Node and pnpm at the versions this repository pins

runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version-file: packages/daemon/go.mod
        cache-dependency-path: packages/daemon/go.sum

    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 22
        cache: pnpm
